<!DOCTYPE>
<html>
    <head>
        <style>
            p {
                color: black;
                font-size: 16px;
                background-color: yellow;
                text-align: left;
            }

            .box {
                color: green;
                font-size: 20px;
                text-align: center;
            }

            #message {
                color: blue;
                background-color: lightgray;
            }

            p.box {
                color: red;
                font-size: 25px;
            }
        </style>
    </head>
    <body>
        <p id="message" class="box" style="color: orange; text-align: right;">Hello World!</p>
    </body>
</html>
