<!DOCTYPE html>
<html lang="en">
    <head>
        <title>CSS Positioning</title>
        <style>
            .red {
                background-color: tomato;
                border: 5px solid darkred;
                padding: 20px;
                margin: 5px;
                width: 100px;
                height: 10px;
                top: 20px;
                position: relative;
            }

            .blue {
                background-color: powderblue;
                border: 5px solid blue;
                padding: 20px;
                margin: 5px;
                width: 100px;
                height: 10px;
                left: 50px;
                position: relative;
            }

            .green {
                background-color: lightgreen;
                border: 5px solid green;
                padding: 20px;
                margin: 5px;
                width: 100px;
                height: 10px;
                left: 150px;
                bottom: 50px;
                position: relative;
            }

            
        </style>
    </head>
    <body>
        <p class="red"> Box1</p>
        <p class="blue">Box2</p>
        <p class="green">Box3</p>
    </body>
</html>
