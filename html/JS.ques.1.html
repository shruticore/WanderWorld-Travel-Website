<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JS formValidation</title>
    </head>
    <body>
        <h1>Registration Form</h1>
        <form action="submit_form.php" method="post">
            <fieldset>
                <label for="User_Id">User Id :</label>
                <input type="text" name="User_Id" id="User_Id" placeholder="Enter Id">
                <br><br>

                <label for="Password">Password :</label>
                <input type="password" name="Password" id="Password" placeholder="Enter password">
                <br><br>

                <label for="Name">Name :</label>
                <input type="text" name="Name" id="Name" placeholder="Enter name">
                <br><br>

                <label for="Address">Address :</label>
                <input type="text" name="Address" id="Address" placeholder="Enter address">
                <br><br>

                <label for="Country">Country :</label>
                <select name="Country" id="Country">
                    <option value="Asia">India</option>
                    <option value="Europe">Italy</option>
                    <option value="Australia">New Zealand</option>
                    <option value="Africa">Egypt</option>
                    <option value="North America">Canada</option>
                </select>
                <br><br>

                <label for="Zip_code">Zip Code :</label>
                <input type="number" name="Zip_code" id="Zip_code" placeholder="Enter Zip">
                <br><br>

                <label for="Email">Email :</label>
                <input type="email" name="Email" id="Email" placeholder="Enter email">
                <br><br>

                <label for="Sex">Sex :</label>
                <input type="radio" name="Sex" id="Male" value="Male">
                <label for="Male">Male</label>
                <input type="radio" name="Sex" id="Female" value="Female">
                <label for="Female">Female</label>
                <br><br>

                <label for="Language">Language :</label>
                <input type="checkbox" name="Language" id="English" value="English">
                <label for="English">English</label>
                <input type="checkbox" name="Language" id="Non_english" value="Non_english">
                <label for="Non_english">Non English</label>
                <br><br>

                <label for="About">About :</label><br>
                <textarea name="About" id="About" rows="18" cols="36" placeholder="Enter about yourself"></textarea>
                <br><br>

                <input type="submit" value="submit">
                
            </fieldset>
        </form>

        <script>
            function validateForm() {

                let User_Id = document.getElementById("User_Id").value;

                User_Id = User_Id.trim();

                if(User_Id === "") {
                    alert("Please filled out User Id!");
                    return false;
                }

                if((User_Id.length < 5) && (User_Id.length >12)){
                    alert("Required and must be of length 5 to 12");
                    return false;
                }

                let Password = document.getElementById("Password").value;

                if(Password === "") {
                    alert ("Please filled out Password!");
                    return false;
                }

                if((Password.length < 7) && (Password.length > 12)) {
                    alert("Required and must be of length 5 to 12");
                    return false;
                }
                 let Name = document.getElementById("Name").value;

                 Name = Name.trim();

                 if( Name === "") {
                    alert("Please filled out name!");
                    return false;
                 }

                 let Zip_code = document.getElementById("Zip_code").value;

                 if(Zip_code === "") {
                    alert("Required!");
                    return false;
                 }

                 if(isNaN(Zip_code)) {
                    alert ("Must be numeric only");
                    return false;
                 }

                 let Email = document.getElementById("Email").value;

                 Email = Email.trim();

                 if(Email === "") {
                    alert("required");
                    return false;
                 }

                 let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]$/;

                 if(!emailPattern.test(Email)) {
                    alert("Must be a valid email!");
                    return false;
                 }


            }
        </script>
    </body>
</html>
