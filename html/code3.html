<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Number check</title>
    </head>
    <body>
        <script>
            let n=-8;

            if(n==0){
                document.write("number is zero");
            }

            else if(n>0 && n%2==0){
                document.write("positive even number");
            }

            else if(n>0 && n%2!=0){
                document.write("positive odd number");
            }

            else{
                document.write("negative number");
            }
        </script>
    </body>
</html>
