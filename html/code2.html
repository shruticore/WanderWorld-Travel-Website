<!DOCTYPE html>

    <body>
        <h1>Basic Calculation</h1>
        <script>
            let n=20;
            let m=10;

            let addition=n+m;
            let substraction=n-m;
            let multiplication=n*m;
            let division=n/m;

            document.write("First number = "+n+"<br>");
            document.write("Second number = "+m+"<br><br>");
            document.write("addition = "+addition+"<br>");
            document.write("substraction = "+substraction+"<br>");
            document.write("multiplication = "+multiplication+"<br>");
            document.write("division = "+division+"<br>");
        </script>
    </body>
</html>
